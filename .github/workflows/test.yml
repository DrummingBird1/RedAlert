name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
        os: [ubuntu-latest]
        include:
          - node: '20'
            os: windows-latest
          - node: '20'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check server.js
          node --check test/unit.js
          node --check test/integration.js
          node --check test/e2e.js
          node --check telegram-bot.js

      - name: Unit tests (node:test)
        run: node test/unit.js

      - name: Integration tests
        run: node test/integration.js

  e2e:
    name: E2E (Playwright + Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check test/e2e.js
      - run: npm install --no-save playwright
      - name: E2E tests (uses the runner's preinstalled Chrome — no bundled-browser download)
        run: node test/e2e.js

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    continue-on-error: true  # optional dependency; don't block merges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save eslint@9
      - run: npx eslint server.js test/unit.js test/integration.js test/e2e.js telegram-bot.js
